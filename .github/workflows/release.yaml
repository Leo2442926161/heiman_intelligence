name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Verify tag and manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/heiman_intelligence/manifest.json)"
          if [ "$TAG" != "v$manifest_version" ]; then
            echo "Tag $TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Build HACS release archive
        run: |
          mkdir -p release
          cd custom_components/heiman_intelligence
          zip -r "$GITHUB_WORKSPACE/release/heiman_intelligence.zip" . \
            -x '*.pyc' '__pycache__/*'
          cd "$GITHUB_WORKSPACE/release"
          sha256sum heiman_intelligence.zip > heiman_intelligence.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            release/heiman_intelligence.zip \
            release/heiman_intelligence.zip.sha256 \
            --verify-tag \
            --title "Heiman Intelligence $TAG" \
            --generate-notes
